<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />

  <!-- GPS / Satellite Node Waves -->
  <circle cx="32" cy="24" r="14" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
  
  <!-- Location / Fuel Pin -->
  <path d="M32 10C24.268 10 18 16.268 18 24C18 33.5 32 48 32 48C32 48 46 33.5 46 24C46 16.268 39.732 10 32 10Z" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- Center Core Sensor Node -->
  <circle cx="32" cy="23" r="5.5" fill="#FFFFFF" />
  <circle cx="32" cy="23" r="2.5" fill="#1E3A8A" />

  <!-- Speed / Pulse Arrow Indicator -->
  <path d="M28 54L32 50L36 54" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>